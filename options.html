<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Info Collector — Settings</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1c22;
        --muted: #5c6270;
        --line: #e6e8ee;
        --accent: #3b5bdb;
        --card: #f7f8fa;
        --ok: #2b8a3e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 28px;
      }
      .field {
        margin-bottom: 24px;
      }
      label.field-label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .hint {
        color: var(--muted);
        font-size: 13.5px;
        margin: 6px 0 0;
      }
      .hint a {
        color: var(--accent);
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: inherit;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .key-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .key-row input {
        flex: 1;
      }
      .reveal-btn {
        white-space: nowrap;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .toggle-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .toggle-card.disabled {
        opacity: 0.7;
      }
      .toggle-card input {
        margin-top: 3px;
        width: 18px;
        height: 18px;
      }
      .toggle-text strong {
        display: block;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: #eceef3;
        border-radius: 999px;
        padding: 2px 8px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 8px;
      }
      .save-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .save-btn:hover {
        filter: brightness(0.96);
      }
      .status {
        color: var(--ok);
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .status.show {
        opacity: 1;
      }
      .privacy {
        margin-top: 32px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13.5px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Key Info Collector</h1>
      <p class="sub">Settings</p>

      <div class="field">
        <label class="field-label" for="api-key">Claude API key</label>
        <div class="key-row">
          <input
            id="api-key"
            type="password"
            placeholder="sk-ant-…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="reveal" class="reveal-btn" type="button">Show</button>
        </div>
        <p class="hint">
          Get a key from
          <a href="https://console.anthropic.com" target="_blank" rel="noopener"
            >console.anthropic.com</a
          >. It's stored locally and only ever sent to api.anthropic.com.
        </p>
      </div>

      <div class="field">
        <label class="toggle-card disabled" for="multimodal">
          <input id="multimodal" type="checkbox" disabled />
          <span class="toggle-text">
            <strong
              >Use screenshots (multimodal)<span class="badge">Coming soon</span></strong
            >
            <span class="hint"
              >When enabled, the page screenshot is sent alongside the text for
              richer results. This feature isn't active yet.</span
            >
          </span>
        </label>
      </div>

      <div class="actions">
        <button id="save" class="save-btn" type="button">Save</button>
        <span id="status" class="status">Saved ✓</span>
      </div>

      <p class="privacy">
        <strong>Privacy:</strong> your API key is stored in
        <code>chrome.storage.local</code> on this device and is sent only to
        <code>api.anthropic.com</code>. It is never shared anywhere else.
      </p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
